<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Обратный отсчёт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #05080c;
        }

        /* Полноэкранная картинка без искажения цветов */
        #bg-image {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            z-index: 1;
            display: block;
        }

        /* Виньетка и затемнение снизу для идеальной читаемости тёмно-красного цвета */
        .vignette {
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.2) 40%, rgba(0, 0, 0, 0.4) 100%),
                radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Снегопад поверх фона */
        #snow {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* Текст сверху */
        .frost-label {
            position: fixed;
            top: clamp(16px, 4vh, 32px);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(11px, 2.5vw, 15px);
            letter-spacing: clamp(4px, 1vw, 8px);
            color: rgba(220, 235, 255, 0.8);
            text-transform: uppercase;
            font-weight: 600;
            z-index: 4;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        /* Контейнер: выравнивание строго ВНИЗУ экрана */
        .content {
            position: relative;
            z-index: 4;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Опускает таймер вниз */
            align-items: center;
            padding: 20px;
            /* Отступ снизу с учётом нижней панели смартфонов */
            padding-bottom: calc(clamp(28px, 7vh, 64px) + env(safe-area-inset-bottom, 0px));
            text-align: center;
        }

        /* Таймер: тёмно-красный, БЕЗ свечения */
        #timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 2.5vw, 24px);
            font-variant-numeric: tabular-nums;
            color: #8b0000; /* Тёмно-красный */
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95); /* Только тень для контраста, без неона */
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: clamp(52px, 16vw, 110px);
        }

        .time-val {
            font-size: clamp(34px, 9.5vw, 84px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
        }

        .time-lbl {
            font-size: clamp(10px, 2.2vw, 14px);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            color: #a33535; /* Приглушённый тёмно-красный */
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .colon {
            font-size: clamp(26px, 7vw, 68px);
            font-weight: 700;
            color: #8b0000;
            margin-bottom: clamp(14px, 3vw, 24px);
            user-select: none;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95);
        }

        /* Финальное сообщение внизу */
        #message {
            display: none;
            font-size: clamp(24px, 6.5vw, 56px);
            font-weight: 800;
            color: #e6f2ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);
            animation: zoomIn 1.2s ease-out forwards;
        }

        @keyframes zoomIn {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- Картинка во весь экран из той же папки -->
    <img id="bg-image" src="before.png" alt="Фон">

    <!-- Виньетка с акцентом на низ, надпись сверху и снег -->
    <div class="vignette"></div>
    <div class="frost-label">— До опасной стадии осталось... —</div>
    <canvas id="snow"></canvas>

    <!-- Блок таймера (прижат к низу) -->
    <div class="content">
        <div id="timer">
            <div class="time-box">
                <span class="time-val" id="days">0</span>
                <span class="time-lbl">days</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="time-val" id="hours">00</span>
                <span class="time-lbl">hours</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="time-val" id="minutes">00</span>
                <span class="time-lbl">minutes</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="time-val" id="seconds">00</span>
                <span class="time-lbl">seconds</span>
            </div>
        </div>

        <div id="message">ОПАСНАЯ СТАДИЯ!!!</div>
    </div>

    <script>
        /* ====== СТРОГОЕ МОСКОВСКОЕ ВРЕМЯ (MSK, UTC+3) ====== */

        // Целевая дата: 27 ноября 2026, 00:00:00 строго по МСК (+03:00)
        const targetDate = new Date('2026-11-27T00:00:00+03:00').getTime();

        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const bgImage = document.getElementById('bg-image');

        const dEl = document.getElementById('days');
        const hEl = document.getElementById('hours');
        const mEl = document.getElementById('minutes');
        const sEl = document.getElementById('seconds');

        // Разница между точным временем сервера и часами устройства
        let serverOffset = 0;

        // Синхронизация с сервером времени (защита от сбитого времени на устройстве)
        async function syncNetworkTime() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Europe/Moscow', { cache: 'no-store' });
                if (!res.ok) throw new Error();
                const data = await res.json();
                const actualTimeMs = new Date(data.utc_datetime).getTime();
                serverOffset = actualTimeMs - Date.now();
            } catch (e) {
                try {
                    const res2 = await fetch('https://timeapi.io/api/v1/time/current/zone?timeZone=Europe/Moscow', { cache: 'no-store' });
                    if (!res2.ok) throw new Error();
                    const data2 = await res2.json();
                    const actualTimeMs2 = new Date(data2.dateTime + '+03:00').getTime();
                    serverOffset = actualTimeMs2 - Date.now();
                } catch (err) {
                    // При оффлайне используются локальные часы
                }
            }
        }

        syncNetworkTime();
        setInterval(syncNetworkTime, 600000);

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function updateCountdown() {
            const now = Date.now() + serverOffset;
            const diff = targetDate - now;

            if (diff <= 0) {
                timerEl.style.display = 'none';
                messageEl.style.display = 'block';
                bgImage.src = 'after.png';
                return;
            }

            const totalSec = Math.floor(diff / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor((totalSec % 86400) / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;

            dEl.textContent = days;
            hEl.textContent = pad(hours);
            mEl.textContent = pad(minutes);
            sEl.textContent = pad(seconds);
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        /* ====== СНЕГОПАД ====== */
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let W, H, flakes;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            const count = Math.min(Math.floor((W * H) / 9000), 120);
            flakes = [];
            for (let i = 0; i < count; i++) {
                flakes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 2.2 + 0.6,
                    speed: Math.random() * 0.9 + 0.5,
                    sway: Math.random() * Math.PI * 2
                });
            }
        }

        function drawSnow() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(230, 240, 255, 0.75)';
            ctx.beginPath();
            for (const f of flakes) {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            }
            ctx.fill();

            for (const f of flakes) {
                f.sway += 0.015;
                f.y += f.speed;
                f.x += Math.sin(f.sway) * 0.5;

                if (f.y > H) {
                    f.y = -5;
                    f.x = Math.random() * W;
                }
                if (f.x > W) f.x = 0;
                if (f.x < 0) f.x = W;
            }
            requestAnimationFrame(drawSnow);
        }

        window.addEventListener('resize', resize);
        resize();
        drawSnow();
    </script>
</body>
</html>
