<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Обратный отсчёт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #05080c;
        }

        /* Полноэкранная картинка без искажения цветов */
        #bg-image {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            z-index: 1;
            display: block;
        }

        /* Лёгкое затемнение и виньетка, чтобы текст всегда читался на любом фоне */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.75) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Снегопад поверх картинки */
        #snow {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* Центрирующий контейнер */
        .content {
            position: relative;
            z-index: 4;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        /* Таймер с нормальным современным шрифтом */
        #timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2.5vw, 24px);
            font-variant-numeric: tabular-nums;
            color: #ff2a2a;
            text-shadow: 
                0 0 20px rgba(255, 30, 30, 0.7),
                0 4px 12px rgba(0, 0, 0, 0.9);
        }

        /* Блок отдельного числа (дни, часы, минуты, секунды) */
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: clamp(54px, 16vw, 110px);
        }

        .time-val {
            font-size: clamp(34px, 9vw, 84px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
        }

        .time-lbl {
            font-size: clamp(10px, 2.2vw, 14px);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            color: rgba(255, 200, 200, 0.85);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .colon {
            font-size: clamp(28px, 7vw, 68px);
            font-weight: 700;
            opacity: 0.8;
            margin-bottom: clamp(14px, 3vw, 24px);
            user-select: none;
        }

        /* Финальное сообщение */
        #message {
            display: none;
            font-size: clamp(28px, 7vw, 68px);
            font-weight: 800;
            color: #e6f2ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow:
                0 0 25px rgba(100, 180, 255, 0.8),
                0 4px 16px rgba(0, 0, 0, 0.9);
            animation: zoomIn 1.2s ease-out forwards;
        }

        @keyframes zoomIn {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- Полноэкранное изображение -->
    <img id="bg-image" src="before.jpg" alt="Фон">

    <!-- Виньетка и Снегопад -->
    <div class="vignette"></div>
    <canvas id="snow"></canvas>

    <!-- Контент -->
    <div class="content">
        <div id="timer">
            <div class="time-box">
                <span class="time-val" id="days">0</span>
                <span class="time-lbl">дней</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="time-val" id="hours">00</span>
                <span class="time-lbl">часов</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="time-val" id="minutes">00</span>
                <span class="time-lbl">минут</span>
            </div>
            <span class="colon">:</span>
            <div class="time-box">
                <span class="time-val" id="seconds">00</span>
                <span class="time-lbl">секунд</span>
            </div>
        </div>

        <div id="message">ОПАСНАЯ СТАДИЯ!!!</div>
    </div>

    <script>
        /* ====== ЛОГИКА ТАЙМЕРА ====== */
        const targetDate = new Date('2026-11-27T00:00:00').getTime();

        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const bgImage = document.getElementById('bg-image');

        const dEl = document.getElementById('days');
        const hEl = document.getElementById('hours');
        const mEl = document.getElementById('minutes');
        const sEl = document.getElementById('seconds');

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function updateCountdown() {
            const now = Date.now();
            const diff = targetDate - now;

            if (diff <= 0) {
                timerEl.style.display = 'none';
                messageEl.style.display = 'block';
                bgImage.src = 'after.jpg';
                return;
            }

            const totalSec = Math.floor(diff / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor((totalSec % 86400) / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;

            dEl.textContent = days;
            hEl.textContent = pad(hours);
            mEl.textContent = pad(minutes);
            sEl.textContent = pad(seconds);
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        /* ====== АНИМАЦИЯ СНЕГА ====== */
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let W, H, flakes;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            const count = Math.min(Math.floor((W * H) / 9000), 120);
            flakes = [];
            for (let i = 0; i < count; i++) {
                flakes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 2.2 + 0.6,
                    speed: Math.random() * 0.9 + 0.5,
                    sway: Math.random() * Math.PI * 2
                });
            }
        }

        function drawSnow() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(230, 240, 255, 0.75)';
            ctx.beginPath();
            for (const f of flakes) {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            }
            ctx.fill();

            for (const f of flakes) {
                f.sway += 0.015;
                f.y += f.speed;
                f.x += Math.sin(f.sway) * 0.5;

                if (f.y > H) {
                    f.y = -5;
                    f.x = Math.random() * W;
                }
                if (f.x > W) f.x = 0;
                if (f.x < 0) f.x = W;
            }
            requestAnimationFrame(drawSnow);
        }

        window.addEventListener('resize', resize);
        resize();
        drawSnow();
    </script>
</body>
</html>
